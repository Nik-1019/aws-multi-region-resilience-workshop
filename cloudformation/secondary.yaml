AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Multi-Region Resilience Workshop - SECONDARY region stack (us-west-2).
  Mirrors the primary networking, ALB and Auto Scaling Group, and hosts a
  cross-region RDS read replica of the primary database. Set PilotLightSize to
  0 for a true pilot light (no running instances until you scale out).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Workshop}
        Parameters: [ProjectName, PrimaryRegion, GitRepoURL, GitBranch]
      - Label: {default: Compute}
        Parameters: [InstanceType, PilotLightSize, LatestAmiId]
      - Label: {default: Database}
        Parameters: [SourceDBInstanceArn, DBInstanceClass, DBName, DBUsername, DBPassword]

Parameters:
  ProjectName:
    Type: String
    Default: resilience-workshop
    AllowedPattern: '[a-z0-9-]{3,19}'
    ConstraintDescription: >-
      3-19 lowercase letters, digits or hyphens. Capped at 19 because the
      longest derived name, '<ProjectName>-secondary-tg', must fit the
      32-character limit AWS puts on load balancer and target group names.

  PrimaryRegion:
    Type: String
    Default: us-east-1
    Description: >-
      Region holding the source database. Also passed to the app as
      PRIMARY_REGION so this stack renders as SECONDARY REGION (blue).

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]

  PilotLightSize:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 2
    Description: >-
      ASG min and desired capacity. 1 = warm standby (instant failover);
      0 = true pilot light, scale out manually during the exercise.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small]

  SourceDBInstanceArn:
    Type: String
    Description: >-
      ARN of the primary RDS instance (RDSArn output of primary.yaml).
    AllowedPattern: 'arn:aws[a-z-]*:rds:[a-z0-9-]+:\d{12}:db:.+'
    ConstraintDescription: Must be a full RDS DB instance ARN.

  DBName:
    Type: String
    Default: workshop
    Description: Database name on the source instance (replicated as-is).

  DBUsername:
    Type: String
    Default: admin
    Description: Master username of the source instance.

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    Description: >-
      Master password of the source instance. The replica inherits these
      credentials; this value is only used to configure the app.

  GitRepoURL:
    Type: String
    Default: https://github.com/Nik-1019/aws-multi-region-resilience-workshop.git

  GitBranch:
    Type: String
    Default: main

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # ---------------------------------------------------------------- network
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16      # distinct from primary, so the two can peer later
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-vpc'}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-igw'}

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-public-1'}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-public-2'}

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-private-1'}

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-private-2'}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-public-rt'}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable}

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable}

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-nat-eip'}

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-nat'}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-private-rt'}

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable}

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable}

  # ------------------------------------------------------- security groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ingress to the secondary ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0, Description: HTTP from anywhere}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS from anywhere}
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-alb-sg'}

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances - HTTP from the ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: HTTP from ALB
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-app-sg'}

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS replica - MySQL from app instances only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: MySQL from app tier
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-db-sg'}

  # ------------------------------------------------------------------ IAM
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-instance-role'}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ------------------------------------------------------------------ ALB
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      # ELBv2 load balancer names are capped at 32 characters, so this name
      # carries no '-alb' suffix -- the resource type already says what it is.
      # The 32-char budget is enforced on ProjectName below.
      Name: !Sub '${ProjectName}-secondary'
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref ALBSecurityGroup]
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '30'}
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary'}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-secondary-tg'
      VpcId: !Ref VPC
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '10'}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  # ------------------------------------------------------------- compute
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ProjectName}-secondary-lt'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt InstanceProfile.Arn}
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub '${ProjectName}-secondary-app'}
              - {Key: workshop, Value: !Ref ProjectName}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            exec > >(tee -a /var/log/user-data.log) 2>&1

            export GIT_REPO_URL='${GitRepoURL}'
            export GIT_BRANCH='${GitBranch}'
            export DB_HOST='${ReadReplica.Endpoint.Address}'
            export DB_PORT='${ReadReplica.Endpoint.Port}'
            export DB_NAME='${DBName}'
            export DB_USER='${DBUsername}'
            export DB_PASSWORD='${DBPassword}'
            export DB_ENGINE='mysql'
            export PRIMARY_REGION='${PrimaryRegion}'
            export APP_PORT='80'

            dnf install -y git
            rm -rf /tmp/workshop-src
            git clone --depth 1 --branch "${!GIT_BRANCH}" \
                "${!GIT_REPO_URL}" /tmp/workshop-src
            bash /tmp/workshop-src/userdata.sh

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${ProjectName}-secondary-asg'
      MinSize: !Ref PilotLightSize
      MaxSize: '2'
      DesiredCapacity: !Ref PilotLightSize
      VPCZoneIdentifier: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-app', PropagateAtLaunch: true}

  # ------------------------------------------------------------- database
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the workshop read replica
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-db-subnets'}

  # Cross-region read replica. No DBName / MasterUsername here: everything is
  # inherited from the source instance. The app detects the read-only state at
  # runtime and renders "Read-Only" on the database card.
  ReadReplica:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-secondary-replica'
      SourceDBInstanceIdentifier: !Ref SourceDBInstanceArn
      SourceRegion: !Ref PrimaryRegion
      DBInstanceClass: !Ref DBInstanceClass
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      MultiAZ: false
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-secondary-replica'}

Outputs:
  ALBDNSName:
    Description: Public DNS name of the secondary ALB
    Value: !GetAtt ALB.DNSName
    Export: {Name: !Sub '${AWS::StackName}-ALBDNSName'}

  ALBUrl:
    Description: Browse here to see the secondary region serving traffic
    Value: !Sub 'http://${ALB.DNSName}'

  ALBSecurityGroupId:
    Description: Security group id for the secondary ALB
    Value: !Ref ALBSecurityGroup
    Export: {Name: !Sub '${AWS::StackName}-ALBSecurityGroupId'}

  VPCId:
    Description: Secondary VPC id
    Value: !Ref VPC
    Export: {Name: !Sub '${AWS::StackName}-VPCId'}

  RDSReplicaEndpoint:
    Description: Read replica endpoint address
    Value: !GetAtt ReadReplica.Endpoint.Address
    Export: {Name: !Sub '${AWS::StackName}-RDSReplicaEndpoint'}

  PilotLightSize:
    Description: Instances currently requested in the secondary ASG
    Value: !Ref PilotLightSize
