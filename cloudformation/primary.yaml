AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Multi-Region Resilience Workshop - PRIMARY region stack (us-east-1).
  VPC across 2 AZs, ALB, Auto Scaling Group running the Flask demo app, and a
  Single-AZ RDS MySQL instance that acts as the replication source for the
  secondary region.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Workshop}
        Parameters: [ProjectName, GitRepoURL, GitBranch]
      - Label: {default: Compute}
        Parameters: [InstanceType, LatestAmiId]
      - Label: {default: Database}
        Parameters: [DBInstanceClass, DBName, DBUsername, DBPassword]

Parameters:
  ProjectName:
    Type: String
    Default: resilience-workshop
    Description: Name prefix applied to every resource.
    AllowedPattern: '[a-z0-9-]{3,22}'
    ConstraintDescription: >-
      3-22 lowercase letters, digits or hyphens. Capped at 22 because the
      longest derived name, the '<ProjectName>-secondary' load balancer, must
      fit the 32-character limit AWS puts on load balancer and target group
      names.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small]

  DBName:
    Type: String
    Default: workshop
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]{2,15}'

  DBUsername:
    Type: String
    Default: admin
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]{2,15}'

  # cfn-lint W1011 suggests a Secrets Manager dynamic reference here. A plain
  # NoEcho parameter is intentional: it keeps the workshop to one moving part
  # and avoids a secret that outlives cleanup.sh.
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: '[a-zA-Z0-9!#$%&()*+,._-]{8,41}'
    ConstraintDescription: >-
      8-41 characters. RDS forbids / @ " and spaces.

  GitRepoURL:
    Type: String
    Default: https://github.com/Nik-1019/aws-multi-region-resilience-workshop.git
    Description: Repository the instances clone at boot.

  GitBranch:
    Type: String
    Default: main

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI, resolved at deploy time.

Resources:

  # ---------------------------------------------------------------- network
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-vpc'}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-igw'}

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-public-1'}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-public-2'}

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-private-1'}

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-private-2'}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-public-rt'}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable}

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable}

  # Single NAT Gateway (both private subnets share it) to keep the workshop cheap.
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-nat-eip'}

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-nat'}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-private-rt'}

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable}

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable}

  # ------------------------------------------------------- security groups
  # chaos.sh revokes and re-adds the ingress rules on this group.
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ingress to the primary ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0, Description: HTTP from anywhere}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS from anywhere}
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-alb-sg'}

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances - HTTP from the ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: HTTP from ALB
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-app-sg'}

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS - MySQL from app instances only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: MySQL from app tier
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-db-sg'}

  # ------------------------------------------------------------------ IAM
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-instance-role'}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ------------------------------------------------------------------ ALB
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      # ELBv2 load balancer names are capped at 32 characters, so this name
      # carries no '-alb' suffix -- the resource type already says what it is.
      # The 32-char budget is enforced on ProjectName below.
      Name: !Sub '${ProjectName}-primary'
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref ALBSecurityGroup]
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '30'}
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary'}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      # Target group names share the ALB's 32-char cap. Abbreviated so the
      # longest name derived from ProjectName is the ALB's '-secondary'
      # (10 chars) rather than a target group suffix, which buys ProjectName
      # more room. A target group can only ever be attached to one load
      # balancer, so this name must change whenever the ALB name does --
      # otherwise a rename replaces the ALB and listener but not the target
      # group, and the new listener cannot claim the still-attached old one.
      Name: !Sub '${ProjectName}-pri-tg'
      VpcId: !Ref VPC
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '10'}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  # ------------------------------------------------------------- compute
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ProjectName}-primary-lt'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt InstanceProfile.Arn}
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub '${ProjectName}-primary-app'}
              - {Key: workshop, Value: !Ref ProjectName}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            exec > >(tee -a /var/log/user-data.log) 2>&1

            export GIT_REPO_URL='${GitRepoURL}'
            export GIT_BRANCH='${GitBranch}'
            export DB_HOST='${Database.Endpoint.Address}'
            export DB_PORT='${Database.Endpoint.Port}'
            export DB_NAME='${DBName}'
            export DB_USER='${DBUsername}'
            export DB_PASSWORD='${DBPassword}'
            export DB_ENGINE='mysql'
            export PRIMARY_REGION='${AWS::Region}'
            export APP_PORT='80'

            dnf install -y git
            rm -rf /tmp/workshop-src
            git clone --depth 1 --branch "${!GIT_BRANCH}" \
                "${!GIT_REPO_URL}" /tmp/workshop-src
            bash /tmp/workshop-src/userdata.sh

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${ProjectName}-primary-asg'
      MinSize: '1'
      MaxSize: '2'
      DesiredCapacity: '1'
      VPCZoneIdentifier: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600     # cloning + pip install is not fast
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-app', PropagateAtLaunch: true}

  # ------------------------------------------------------------- database
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the workshop database
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-db-subnets'}

  # DeletionPolicy is Delete on purpose: RDS defaults to Snapshot, which would
  # leave participants paying for storage after cleanup.sh runs.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-primary-db'
      Engine: mysql
      # EngineVersion is deliberately omitted: RDS picks the current regional
      # default, so this template keeps working as MySQL minor versions retire.
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      StorageType: gp2
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      MultiAZ: false
      PubliclyAccessible: false
      # Backups must stay enabled: a cross-region read replica cannot be
      # created from a source with BackupRetentionPeriod = 0.
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      CopyTagsToSnapshot: false
      AutoMinorVersionUpgrade: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary-db'}

Outputs:
  ALBDNSName:
    Description: Public DNS name of the primary ALB
    Value: !GetAtt ALB.DNSName
    Export: {Name: !Sub '${AWS::StackName}-ALBDNSName'}

  ALBUrl:
    Description: Browse here to see the primary region serving traffic
    Value: !Sub 'http://${ALB.DNSName}'

  ALBSecurityGroupId:
    Description: Security group chaos.sh breaks and restores
    Value: !Ref ALBSecurityGroup
    Export: {Name: !Sub '${AWS::StackName}-ALBSecurityGroupId'}

  VPCId:
    Description: Primary VPC id
    Value: !Ref VPC
    Export: {Name: !Sub '${AWS::StackName}-VPCId'}

  RDSEndpoint:
    Description: Primary RDS endpoint address
    Value: !GetAtt Database.Endpoint.Address
    Export: {Name: !Sub '${AWS::StackName}-RDSEndpoint'}

  RDSArn:
    Description: Pass this to secondary.yaml as SourceDBInstanceArn
    Value: !GetAtt Database.DBInstanceArn
    Export: {Name: !Sub '${AWS::StackName}-RDSArn'}

  DBName:
    Description: Database name
    Value: !Ref DBName
